name: Verify networking library pin

on:
  push:
    branches: [ios-networking-assets-test]
    paths: [.gitmodules, libultraship, .github/workflows/update-libultraship-submodule.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify the committed dependency graph
        run: |
          test -z "$(git submodule status --recursive | sed -n '/^[+-U]/p')"
          test -f libultraship/cmake/dependencies/patches/sdl2-uikit-scenes.patch
          test -f libultraship/cmake/dependencies/patches/sdl2-uikit-orientation.patch
