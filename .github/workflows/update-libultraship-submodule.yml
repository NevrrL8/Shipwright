
name: Update libultraship submodule


on:
  push:
    branches:
      - ios-networking-assets-test
    paths:
      - .github/workflows/update-libultraship-submodule.yml
  workflow_dispatch:


permissions:
  contents: write

jobs:
  update-libultraship:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shipwright
        uses: actions/checkout@v4
        with:
          ref: ios-networking-assets-test
          submodules: false
          persist-credentials: true

      - name: Update libultraship pointer
        run: |
          git submodule sync -- libultraship
          git submodule update --init libultraship
          
          git -C libultraship fetch origin 03316fca90addc46a5b198b81a9fba79235639bb
          git -C libultraship checkout 03316fca90addc46a5b198b81a9fba79235639bb

          git add libultraship
          if git diff --cached --quiet; then
            echo "libultraship pointer already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin libultraship with restored SDL UIKit patch"
          git push origin HEAD:ios-networking-assets-test
